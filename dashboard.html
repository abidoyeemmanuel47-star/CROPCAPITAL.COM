  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background: #f3f7f0;
      color: #173d28;
    }

    header {
      background: #12472d;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    header h1 {
      margin: 0;
      font-size: 23px;
    }

    header a {
      color: white;
      text-decoration: none;
      margin-left: 12px;
      font-size: 14px;
    }

    .welcome {
      background: #1c6039;
      color: white;
      padding: 28px 20px;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .notice {
      background: #fff4d6;
      border-left: 5px solid #d99a00;
      padding: 15px;
      border-radius: 6px;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .section-title {
      margin-top: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 3px 12px #0000000c;
    }

    .card h3 {
      margin-top: 0;
    }

    .crop {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .button {
      display: inline-block;
      padding: 11px 16px;
      background: #b7e34b;
      color: #173d28;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .secondary {
      background: #12472d;
      color: white;
    }

    .muted {
      color: #66756a;
      font-size: 14px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 22px;
      background: #12472d;
      color: white;
      margin-top: 30px;
      font-size: 13px;
    }
  </style>
</head>
