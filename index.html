<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CROPCAPITAL explores agricultural commodities, production, storage and supply chains.">
  <title>CROPCAPITAL | Agricultural Opportunities</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      color: #173d28;
      background: #f5f8f2;
      line-height: 1.6;
    }

    header {
      background: #103d28;
      color: white;
      padding: 18px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .logo span {
      color: #b7e34b;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 17px;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #b7e34b;
    }

    .hero {
      background: linear-gradient(120deg, #103d28, #287447);
      color: white;
      padding: 65px 7%;
    }

    .hero-content {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .tag {
      display: inline-block;
      background: #ffffff1c;
      border: 1px solid #ffffff55;
      border-radius: 25px;
      padding: 7px 15px;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 54px);
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero h1 span {
      color: #c7ed70;
    }

    .hero p {
      max-width: 650px;
      margin: 0 auto 28px;
      color: #e6f1e8;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      padding: 13px 21px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
      margin: 5px;
    }

    .button-primary {
      background: #b7e34b;
      color: #173d28;
    }

    .button-outline {
      border: 1px solid white;
      color: white;
    }

    .button-primary:hover {
      background: #d0f278;
    }

    .section {
      max-width: 1100px;
      margin: auto;
      padding: 50px 20px;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-heading h2 {
      font-size: 29px;
      margin-bottom: 8px;
    }

    .section-heading p {
      color: #627267;
    }

    .crop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .crop-card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      border: 1px solid #e2eadf;
      box-shadow: 0 5px 18px #173d2808;
    }

    .crop-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .crop-card h3 {
      margin-bottom: 10px;
      font-size: 21px;
    }

    .crop-card p {
      color: #627267;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .crop-card a {
      color: #17643b;
      font-weight: bold;
      text-decoration: none;
    }

    .about {
      background: #e8f0e3;
    }

    .about-inner {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .about h2 {
      font-size: 28px;
      margin-bottom: 15px;
    }

    .about p {
      color: #46594b;
      margin-bottom: 12px;
    }

    .notice {
      max-width: 1000px;
      margin: 35px auto;
      padding: 18px;
      background: #fff4d6;
      border-left: 5px solid #d99a00;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      background: #103d28;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    footer p {
      color: #d8e5da;
      font-size: 13px;
      margin-top: 8px;
    }

    .footer-links {
      margin-top: 15px;
    }

    .footer-links a {
      color: #c7ed70;
      text-decoration: none;
      margin: 0 8px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        justify-content: center;
        text-align: center;
      }

      nav {
        justify-content: center;
      }

      .hero {
        padding: 48px 20px;
      }

      .hero p {
        font-size: 15px;
      }

      .section {
        padding: 38px 18px;
      }

      .notice {
        margin: 20px 15px;
      }
    }
  </style>
</head>

    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
  </nav>
</header>

    <p>

      production, processing, storage, and distribution create value.
